name: Cross Browser Tests

on:
  push:
    branches:
      - main

jobs:

  browser-test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Run Selenium Test
        run: mvn test -Dbrowser=${{ matrix.browser }}